name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and lint
        run: bash ./gradlew --no-daemon assembleDebug lintDebug
      - name: Test retouch math
        run: |
          javac -d app/build/retouch-tests app/src/main/java/com/nguyentrungduc1/watermarkcam/RetouchTone.java tests/RetouchToneTest.java
          java -cp app/build/retouch-tests com.nguyentrungduc1.watermarkcam.RetouchToneTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: Lucid-Camera-1.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
